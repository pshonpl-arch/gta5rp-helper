function vehicleKey(value){return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function findVehicle(name){const key=vehicleKey(name);return vehicleCatalog.find(v=>vehicleKey(v.name)===key||v.model===key)}
function searchVehicles(query){const key=vehicleKey(query);if(!key)return [];return vehicleCatalog.filter(v=>vehicleKey(v.name+' '+v.model+' '+v.alias).includes(key)).sort((a,b)=>Number(!vehicleKey(a.name).startsWith(key))-Number(!vehicleKey(b.name).startsWith(key))).slice(0,30)}
function vehiclePicture(name,large=false){const v=findVehicle(name);return `<div class="vehicle-picture ${large?'vehicle-large':''}"><span class="vehicle-fallback">${v?'Изображение машины':esc(name.slice(0,2).toUpperCase())}</span>${v?`<img src="${esc(v.image)}" alt="${esc(v.name)}" loading="lazy" referrerpolicy="no-referrer">`:''}</div>`}
function bindVehicleImages(root=document){root.querySelectorAll('.vehicle-picture img').forEach(img=>{const loaded=()=>{img.previousElementSibling.hidden=true;img.classList.add('loaded')};const failed=()=>{img.previousElementSibling.hidden=false;img.previousElementSibling.textContent='Нет изображения';img.remove()};img.onload=loaded;img.onerror=failed;if(img.complete){if(img.naturalWidth)loaded();else failed()}})}
function bindVehiclePicker(){const input=document.querySelector('#car-name'),list=document.querySelector('#vehicle-options'),preview=document.querySelector('#vehicle-preview');let shown;
 const update=()=>{const matches=searchVehicles(input.value);list.replaceChildren(...matches.map(v=>{const option=document.createElement('option');option.value=v.name;option.label=v.source||v.model;return option}));const v=findVehicle(input.value),model=v?.model||'';if(model===shown)return;shown=model;preview.innerHTML=v?vehiclePicture(v.name,true):'';bindVehicleImages(preview)};
 input.addEventListener('input',update);input.addEventListener('change',update);update();
}

"><div class="panel-head"><h2>История аренды</h2><span class="caption">${rentals.length} записей</span></div>${rentals.length?`<div class="table-wrap"><table><thead><tr><th>Машина</th><th>Начало</th><th>До</th><th>Статус</th><th>Чистый доход</th><th></th></tr></thead><tbody>${[...rentals].sort((a,b)=>b.start-a.start).map(r=>{const e=entries.find(e=>e.id===r.entryId);return `<tr><td>${esc(r.carName)}</td><td>${new Date(r.start).toLocaleString('ru-RU')}</td><td>${new Date(r.end).toLocaleString('ru-RU')}</td><td><span class="pill">${r.finishedAt?'Возвращена':r.end<Date.now()?'Срок истёк':'В аренде'}</span></td><td class="positive">${money(e?net(e):0)}</td><td><button class="text-btn" data-edit-rental="${r.id}">Изменить</button></td></tr>`}).join('')}</tbody></table></div>`:'<p>При сдаче машины оплаченная сумма и комиссия автоматически попадут в журнал.</p>'}</section>`}
function rentalClock(r){const s=Math.ceil((r.end-Date.now())/1000);if(s<=0)return 'Срок истёк — проверь возврат';return `${Math.floor(s/3600)} ч ${Math.floor(s%3600/60)} мин ${s%60} сек`}

function localDate(ms){const d=new Date(ms);return new Date(ms-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function rentalTotal(rate,hours){if(!Number.isFinite(rate)||rate<=0||rate>1e12||!Number.isFinite(hours)||hours<.05||hours>8760)throw Error('Укажи цену за час и количество часов');const amount=Math.round(rate*hours);if(!Number.isSafeInteger(amount)||amount<1||amount>1e12)throw Error('Проверь итоговую сумму аренды');return amount}

async function createFirebaseClient(){

 },

 };

function analysisEntries(range=period,now=Date.now()) {const d=new Date(now);if(range==='day')d.setHours(0,0,0,0);else if(range==='week'){d.setHours(0,0,0,0);d.setDate(d.getDate()-6)}else if(range==='month'){d.setDate(1);d.setHours(0,0,0,0)}else return entries.filter(e=>new Date(e.date).getTime()<=now);return entries.filter(e=>new Date(e.date).getTime()>=d.getTime()&&new Date(e.date).getTime()<=now)}
function analyzeRecords(rows,now=Date.now()){
 const income=rows.reduce((s,e)=>s+Math.max(e.amount,0),0),costs=rows.reduce((s,e)=>s+Math.max(-e.amount,0)+e.fee,0),fees=rows.reduce((s,e)=>s+e.fee,0);
 const groups=new Map(),days=new Map();for(const e of rows){const key=e.job||'Другое',g=groups.get(key)||{name:key,income:0,costs:0,net:0,count:0};g.income+=Math.max(0,e.amount);g.costs+=Math.max(0,-e.amount)+e.fee;g.net+=net(e);g.count++;groups.set(key,g);const day=new Date(e.date).toLocaleDateString('ru-RU');days.set(day,(days.get(day)||0)+net(e))}
 const ranked=[...groups.values()].sort((a,b)=>b.net-a.net),carStats=cars.map(c=>{const a=rows.filter(e=>e.carId===c.id),rentalRows=a.filter(e=>e.rentalId);let amount=0,hours=0;for(const e of rentalRows){const r=rentals.find(r=>r.id===e.rentalId);if(r&&r.end>r.start){hours+=(r.end-r.start)/3600000;amount+=net(e)}}return {id:c.id,name:c.name,count:rentalRows.length,net:a.reduce((s,e)=>s+net(e),0),hours,rate:hours?amount/hours:null}}).filter(c=>c.count||rows.some(e=>e.carId===c.id)).sort((a,b)=>b.net-a.net);

function analystAdvice(a){const tips=[];if(!a.count)return ['Добавь доходы и расходы в журнал. Тогда здесь появятся выводы по твоим данным.'];

function weekComparison(now=Date.now()){
 const end=new Date(now),start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-6);const previousStart=new Date(start),previousEnd=new Date(end);previousStart.setDate(previousStart.getDate()-7);previousEnd.setDate(previousEnd.getDate()-7);

 return {current,previous,currentRows,previousRows,start,end,previousStart,previousEnd,delta:current.profit-previous.profit,comparable:current.count>0&&previous.count>0};

function earningActions(a){const items=[];if(a.expired.length)items.push({type:'urgent',icon:'◷',title:'Проверь возврат машин',text:`Срок ${a.expired.length} аренд истёк. Возврат ещё не отмечен.`,href:'#garage',action:'Открыть автопарк'});

pan class="pill">${a.count} операций</span></div>${a.ranked.length?`<div class="table-wrap"><table><thead><tr><th>Категория</th><th>Поступления</th><th>Расходы</th><th>Результат</th></tr></thead><tbody>${a.ranked.map(g=>`<tr><td>${esc(g.name)}<small>${g.count} записей</small></td><td>${money(g.income)}</td><td>${money(g.costs)}</td><td class="${g.net>=0?'positive':'negative'}">${money(g.net)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Добавь первые операции — и увидишь сравнение.</div>'}<p class="caption">Суммы по категориям не показывают заработок в час. Расходы из других категорий автоматически не распределяются.</p></section><details class="panel helper-details"><summary>Все выводы и последние записи</summary><ul>${analystAdvice(a).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${analystEvidence(rows)}<p class="caption">Бесплатный анализ записанного журнала. Помощник не видит рынок игры и не гарантирует будущий доход.</p></details>`}
