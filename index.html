function vehicleKey(value){return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function findVehicle(name){const key=vehicleKey(name);return vehicleCatalog.find(v=>vehicleKey(v.name)===key||v.model===key)}
function searchVehicles(query){const key=vehicleKey(query);if(!key)return [];return vehicleCatalog.filter(v=>vehicleKey(v.name+' '+v.model+' '+v.alias).includes(key)).sort((a,b)=>Number(!vehicleKey(a.name).startsWith(key))-Number(!vehicleKey(b.name).startsWith(key))).slice(0,30)}
function vehiclePicture(name,large=false){const v=findVehicle(name);return `<div class="vehicle-picture ${large?'vehicle-large':''}"><span class="vehicle-fallback">${v?'Изображение машины':esc(name.slice(0,2).toUpperCase())}</span>${v?`<img src="${esc(v.image)}" alt="${esc(v.name)}" loading="lazy" referrerpolicy="no-referrer">`:''}</div>`}
function bindVehicleImages(root=document){root.querySelectorAll('.vehicle-picture img').forEach(img=>{const loaded=()=>{img.previousElementSibling.hidden=true;img.classList.add('loaded')};const failed=()=>{img.previousElementSibling.hidden=false;img.previousElementSibling.textContent='Нет изображения';img.remove()};img.onload=loaded;img.onerror=failed;if(img.complete){if(img.naturalWidth)loaded();else failed()}})}
function bindVehiclePicker(){const input=document.querySelector('#car-name'),list=document.querySelector('#vehicle-options'),preview=document.querySelector('#vehicle-preview');let shown;
 const update=()=>{const matches=searchVehicles(input.value);list.replaceChildren(...matches.map(v=>{const option=document.createElement('option');option.value=v.name;option.label=v.source||v.model;return option}));const v=findVehicle(input.value),model=v?.model||'';if(model===shown)return;shown=model;preview.innerHTML=v?vehiclePicture(v.name,true):'';bindVehicleImages(preview)};
 input.addEventListener('input',update);input.addEventListener('change',update);update();
}

function activeRental(carId){return rentals.find(r=>r.carId===carId&&!r.finishedAt)}

"><div class="panel-head"><h2>История аренды</h2><span class="caption">${rentals.length} записей</span></div>${rentals.length?`<div class="table-wrap"><table><thead><tr><th>Машина</th><th>Начало</th><th>До</th><th>Статус</th><th>Чистый доход</th><th></th></tr></thead><tbody>${[...rentals].sort((a,b)=>b.start-a.start).map(r=>{const e=entries.find(e=>e.id===r.entryId);return `<tr><td>${esc(r.carName)}</td><td>${new Date(r.start).toLocaleString('ru-RU')}</td><td>${new Date(r.end).toLocaleString('ru-RU')}</td><td><span class="pill">${r.finishedAt?'Возвращена':r.end<Date.now()?'Срок истёк':'В аренде'}</span></td><td class="positive">${money(e?net(e):0)}</td><td><button class="text-btn" data-edit-rental="${r.id}">Изменить</button></td></tr>`}).join('')}</tbody></table></div>`:'<p>При сдаче машины оплаченная сумма и комиссия автоматически попадут в журнал.</p>'}</section>`}
function rentalClock(r){const s=Math.ceil((r.end-Date.now())/1000);if(s<=0)return 'Срок истёк — проверь возврат';return `${Math.floor(s/3600)} ч ${Math.floor(s%3600/60)} мин ${s%60} сек`}
function bindGarage(){bindVehicleImages();document.querySelector('#add-car')?.addEventListener('click',()=>carModal());$$('[data-edit-car]').forEach(b=>b.onclick=()=>carModal(b.dataset.editCar));$$('[data-rent-car]').forEach(b=>b.onclick=()=>rentalModal(b.dataset.rentCar));$$('[data-edit-rental]').forEach(b=>b.onclick=()=>{const r=rentals.find(r=>r.id===b.dataset.editRental);if(r)rentalModal(r.carId,r.id)});$$('[data-return]').forEach(b=>b.onclick=()=>returnCar(b.dataset.return));$$('[data-car-expense]').forEach(b=>b.onclick=()=>carExpense(b.dataset.carExpense))}

function localDate(ms){const d=new Date(ms);return new Date(ms-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function rentalModal(carId,id){const c=cars.find(c=>c.id===carId),r=rentals.find(r=>r.id===id),e=r&&entries.find(e=>e.id===r.entryId);if(!c)return;openDialog(`<h2>${r?'Изменить аренду':'Сдать в аренду'}</h2>${vehiclePicture(c.name, true)}<p>${esc(c.name)}</p><form id="rental-form"><label class="field">Начало<input id="rental-start" type="datetime-local" value="${localDate(r?.start||Date.now())}" required></label><label class="field">Длительность, часов<input id="rental-hours" type="number" min="0.05" max="8760" step="any" value="${r?(r.end-r.start)/3600000:1}" required></label><label class="field">Получено за весь срок, $<input id="rental-amount" type="number" min="0" max="1000000000000" step="1" value="${e?.amount??''}" placeholder="30 000" required></label><label class="field">Стоимость объявления, $<input id="rental-fee" type="number" min="0" max="1000000000000" step="1" value="${e?.fee??0}" required></label><div class="notice">Записывай уже полученную оплату. Доход попадёт в журнал один раз; возврат машины не добавляет повторный доход.</div><button class="primary full">${r?'Сохранить изменения':'Начать аренду'}</button></form>${r?'<button id="delete-rental" class="danger full">Удалить аренду и её оплату</button>':''}`);bindVehicleImages();$('#rental-form').onsubmit=ev=>{ev.preventDefault();if(!canEdit())return;try{recordRental(carId,id,{start:new Date($('#rental-start').value).getTime(),hours:Number($('#rental-hours').value),amount:Number($('#rental-amount').value),fee:Number($('#rental-fee').value)});$('#modal').close();render();toast('Аренда сохранена')}catch(err){toast(err.message)}};if(r)$('#delete-rental').onclick=()=>{if(!canEdit())return;if(confirm('Удалить эту аренду и связанную запись дохода?')){rentals=rentals.filter(x=>x.id!==r.id);entries=entries.filter(x=>x.id!==r.entryId);persist();$('#modal').close();render()}}}
function recordRental(carId,id,v){const c=cars.find(c=>c.id===carId),r=rentals.find(r=>r.id===id);if(!c||c.archived&&!r)throw Error('Машина недоступна');if(!r&&activeRental(carId))throw Error('Машина уже в аренде');if(!Number.isFinite(v.start)||!Number.isFinite(v.hours)||v.hours<.05||v.hours>8760||![v.amount,v.fee].every(n=>Number.isSafeInteger(n)&&n>=0&&n<=1e12))throw Error('Проверь время, сумму и комиссию');const end=v.start+v.hours*3600000;if(!Number.isFinite(end))throw Error('Некорректная дата');const rentalId=r?.id||crypto.randomUUID(),entryId=r?.entryId||crypto.randomUUID();const data={id:rentalId,carId,carName:c.name,start:v.start,end,finishedAt:r?.finishedAt??null,entryId};const entry={id:entryId,amount:v.amount,fee:v.fee,date:new Date(v.start).toISOString(),description:'Аренда · '+c.name,job:'Аренда',carId,rentalId};if(r)Object.assign(r,data);else rentals.push(data);const idx=entries.findIndex(x=>x.id===entryId);if(idx>=0)entries[idx]=entry;else entries.push(entry);persist();return data}
function returnCar(id){if(!canEdit())return;const r=rentals.find(r=>r.id===id);if(!r||r.finishedAt)return;if(!confirm('Машина уже вернулась и доступна для новой аренды?'))return;r.finishedAt=Date.now();persist();render();toast('Машина свободна')}
function carExpense(id){const c=cars.find(c=>c.id===id);if(!c)return;openDialog(`<h2>Расход на машину</h2><p>${esc(c.name)}</p><form id="expense-form"><label class="field">Сумма расхода, $<input id="expense-amount" type="number" min="1" max="1000000000000" required></label><label class="field">Описание<input id="expense-description" maxlength="100" placeholder="Ремонт, топливо…" required></label><button class="primary full">Добавить расход</button></form>`);$('#expense-form').onsubmit=ev=>{ev.preventDefault();if(!canEdit())return;const amount=Number($('#expense-amount').value),description=$('#expense-description').value.trim();if(!Number.isSafeInteger(amount)||amount<=0||amount>1e12||!description)return;saveEntry({id:crypto.randomUUID(),date:new Date().toISOString(),amount:-amount,fee:0,description:c.name+' · '+description,job:'Автопарк',carId:id})}}
setInterval(()=>{document.querySelectorAll('[data-rental-clock]').forEach(el=>{const r=rentals.find(r=>r.id===el.dataset.rentalClock);if(r)el.textContent=rentalClock(r)})},1000);

</script><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('de-DE'), money=n=>fmt(n)+' $';
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const initialState=loadLocalScope();
let {entries,timers,cars,rentals}=initialState;let period='all',view='overview',audioCtx;
const persist=persistState;
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').style.display='none',4000)}
const paths=['M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z','M4 4h16v16H4z M8 8h8 M8 12h2 M14 12h2 M8 16h2 M14 16h2','M5 20V10 M12 20V4 M19 20V7','M4 3v6q0 4 4 4V3 M6 13v8 M17 3q-5 8 1 10V3 M18 13v8','M12 8v5l3 2 M9 2h6 M12 2v3 M21 13a9 9 0 1 1-18 0 9 9 0 0 1 18 0','M12 5q-4-3-9-1v15q5-2 9 1 4-3 9-1V4q-5-2-9 1v15'];
paths.push('M3 15V9l2-5h14l2 5v6 M3 9h18 M5 15v3 M19 15v3 M6 12h2 M16 12h2','M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-3a8 8 0 0 1 16 0v3');
const tabs=[['overview','Обзор'],['ledger','Калькулятор'],['work','Работы и SHIFT'],['recipes','Кулинария'],['timers','Таймеры'],['guide','База знаний'],['garage','Автопарк'],['account','Аккаунт']];
$('#nav').innerHTML=tabs.map(([id,n],i)=>`<a href="#${id}" data-nav="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[i]}"/></svg><span>${n}</span></a>`).join('');
function filtered(){let d=new Date();if(period==='day')d.setHours(0,0,0,0);else if(period==='week'){d.setHours(0,0,0,0);d.setDate(d.getDate()-6)}else if(period==='month'){d.setDate(1);d.setHours(0,0,0,0)}else return entries;return entries.filter(e=>new Date(e.date)>=d)}
const sum=(arr,f)=>arr.reduce((s,e)=>s+f(e),0),net=e=>e.amount-e.fee;
function stats(){const a=filtered(),inc=sum(a,e=>Math.max(0,e.amount)),exp=sum(a,e=>Math.max(0,-e.amount)+e.fee);return `<div class="stats"><div class="stat highlight"><label>Чистая прибыль</label><span class="symbol">↗</span><strong>${fmt(inc-exp)} <em>$</em></strong><small>Доходы за вычетом всех расходов</small></div><div class="stat"><label>Доходы</label><span class="symbol positive">↗</span><strong>${fmt(inc)} <em>$</em></strong><small>${a.filter(e=>e.amount>0).length} доходных операций</small></div><div class="stat"><label>Расходы</label><span class="symbol negative">↙</span><strong>${fmt(exp)} <em>$</em></strong><small>Включая комиссии объявлений</small></div></div>`}
function periodButtons(){return `<div class="period">${[['day','Сегодня'],['week','7 дней'],['month','Месяц'],['all','Всё время']].map(([v,l])=>`<button data-period="${v}" class="${period===v?'active':''}">${l}</button>`).join('')}</div>`}
function form(e){return `<form id="entry-form"><label class="field" for="amount">Сумма <span class="muted">· минус для расхода</span></label><input id="amount" class="amount" type="text" inputmode="text" autocomplete="off" placeholder="30.000 или −12.500" value="${e?fmt(e.amount):''}" required><label class="field" for="description">Что делал</label><input id="description" maxlength="160" placeholder="Например, час работал в порту" value="${esc(e?.description||'')}" required>${e?`<label class="field">Работа<select id="entry-job">${jobs.map(j=>`<option ${e.job===j?'selected':''}>${j}</option>`).join('')}</select></label><label class="field">Комиссия объявления, $<input id="edit-fee" type="number" min="0" max="100000000" value="${e.fee}"></label>`:''}<button class="primary full" type="submit">${e?'Сохранить изменения':'＋ Добавить операцию'}</button><p class="save-note">${e?'': 'Сохраняется автоматически · статус в разделе «Аккаунт»'}</p></form>`}
function table(a,limit){a=[...a].sort((x,y)=>y.date.localeCompare(x.date));if(limit)a=a.slice(0,limit);return a.length?`<div class="table-wrap"><table><thead><tr><th>ОПЕРАЦИЯ</th><th>КАТЕГОРИЯ</th><th>ДАТА</th><th>ИТОГО</th><th></th></tr></thead><tbody>${a.map(e=>`<tr class="table-link" data-entry="${e.id}" title="Редактировать операцию"><td>${esc(e.description)}${e.fee?`<small>Комиссия ${money(e.fee)}</small>`:''}</td><td><span class="pill">${esc(e.job)}</span></td><td class="muted">${new Date(e.date).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'})}</td><td class="${net(e)>=0?'positive':'negative'}">${net(e)>0?'+':''}${money(net(e))}</td><td><button class="text-btn" data-edit="${e.id}" aria-label="Редактировать">✎</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Здесь появятся твои операции</b>Запиши первый доход или расход — начнём считать.</div>`}
function chart(){const days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let a=entries.filter(e=>new Date(e.date).toDateString()===d.toDateString());return {label:d.toLocaleDateString('ru-RU',{weekday:'short'}),inc:sum(a,e=>Math.max(e.amount,0)),exp:sum(a,e=>Math.max(-e.amount,0)+e.fee)}}),max=Math.max(1,...days.flatMap(d=>[d.inc,d.exp]));return `<div class="panel-head"><h2>Динамика за неделю</h2><div class="legend"><span><i></i>Доход</span><span><i class="gray"></i>Расход</span></div></div><div class="chart" role="img" aria-label="Доходы и расходы за последние семь дней">${days.map(d=>`<div class="bar-group" title="${d.label}: доход ${money(d.inc)}, расход ${money(d.exp)}"><div class="bar" style="height:${d.inc/max*100}%"></div><div class="bar exp" style="height:${d.exp/max*100}%"></div></div>`).join('')}</div><div class="days">${days.map(d=>`<span>${d.label}</span>`).join('')}</div>${!entries.length?'<p class="caption" style="margin-top:14px">График заполнится после добавления операций.</p>':''}`}
function infer(s){s=s.toLowerCase();const rules=[['Рыбалка',/рыб|улов|кайо|кайпер/],['Порт',/порт/],['Стройка',/строй/],['Шахта',/шахт/],['Ферма',/ферм/],['Аренда',/аренд/],['Продажа',/продаж|продал/],['Кулинария',/готов|кулинар|блюд|котлет/],['Поиск сокровищ',/клад|сокровищ/]];return rules.find(r=>r[1].test(s))?.[0]||'Другое'}
function bindEntry(e){const root=e?document.querySelector('#modal'):document.querySelector('#app');const $=s=>root.querySelector(s);$('#entry-form')?.addEventListener('submit',ev=>{ev.preventDefault();if(!canEdit())return;const raw=$('#amount').value.replace(/[.\s]/g,'').replace('−','-');if(!/^-?\d+$/.test(raw)||!Number.isSafeInteger(Number(raw))||Math.abs(Number(raw))>1e12||Number(raw)===0)return toast('Введите целую сумму: 30.000 или -12.500');const description=$('#description').value.trim();if(!description)return toast('Добавьте описание');let v={...e,id:e?.id||crypto.randomUUID(),date:e?.date||new Date().toISOString(),amount:Number(raw),description,job:e?$('#entry-job').value:infer(description),fee:e?Number($('#edit-fee').value):0};if(!e&&/аренд|продаж|продал/i.test(description)){showFee(v);return}saveEntry(v)});$('#amount')?.addEventListener('blur',e=>{const raw=e.target.value.replace(/[.\s]/g,'').replace('−','-');if(/^-?\d+$/.test(raw))e.target.value=fmt(Number(raw))})}
function saveEntry(e){if(!canEdit())return;if(!Number.isFinite(e.fee)||e.fee<0)return toast('Комиссия должна быть неотрицательной');const i=entries.findIndex(x=>x.id===e.id);if(i>=0)entries[i]=e;else entries.push(e);persist();$('#modal').close();render();toast('Операция сохранена')}
function showFee(e){const m=$('#modal');m.innerHTML=`<button class="close" onclick="this.closest('dialog').close()" aria-label="Закрыть">×</button><h2>Стоимость объявления</h2><p>Укажи фактическое списание в игре с учётом своего VIP. Комиссия будет учтена как расход.</p><div class="row" style="margin-top:20px">${[0,125,500].map(n=>`<button data-fee="${n}">${money(n)}</button>`).join('')}</div><form id="fee-form"><label class="field">Другая сумма, $<input type="number" id="fee-value" value="500" min="0" max="100000000" required></label><button class="primary full">Сохранить операцию</button></form>`;if(!m.open)m.showModal();$$('[data-fee]').forEach(b=>b.onclick=()=>$('#fee-value').value=b.dataset.fee);$('#fee-form').onsubmit=ev=>{ev.preventDefault();saveEntry({...e,fee:Number($('#fee-value').value)})}}
function edit(id){const e=entries.find(e=>e.id===id);if(!e)return;if(e.rentalId){const r=rentals.find(r=>r.id===e.rentalId);if(r)return rentalModal(r.carId,r.id)}$('#modal').innerHTML=`<button class="close" onclick="this.closest('dialog').close()" aria-label="Закрыть">×</button><h2>Редактировать операцию</h2>${form(e)}<button id="delete-entry" class="danger full">Удалить операцию</button>`;$('#modal').showModal();bindEntry(e);$('#delete-entry').onclick=()=>{if(!canEdit())return;if(confirm('Удалить эту операцию?')){entries=entries.filter(x=>x.id!==id);persist();$('#modal').close();render();toast('Операция удалена')}}}
function overview(){return `<div class="title"><div><h1>Всё под контролем</h1><p>Твои заработки в Лос-Сантосе</p></div>${periodButtons()}</div>${stats()}<div class="grid"><section class="panel">${chart()}</section><section class="panel"><h2>Новая операция</h2>${form()}</section></div><div class="quick-links"><a class="quick" href="#work"><span class="qicon">↗</span><div><b>Работы и SHIFT</b><small>Рассчитай свою смену</small></div><span>↗</span></a><a class="quick" href="#recipes"><span class="qicon">♧</span><div><b>Кулинария</b><small>Рецепты и себестоимость</small></div><span>↗</span></a><a class="quick" href="#timers"><span class="qicon">◷</span><div><b>Таймеры</b><small>Не пропусти следующий заход</small></div><span>↗</span></a></div><section class="panel"><div class="panel-head"><h2>Последние операции</h2><a class="text-btn" href="#ledger">Весь журнал →</a></div>${table(filtered(),5)}</section>`}
function ledger(){return `<div class="title"><div><h1>Калькулятор заработка</h1><p>Каждая операция — в одном журнале</p></div>${periodButtons()}</div>${stats()}<div class="grid"><section class="panel"><h2>Новая операция</h2>${form()}</section><section class="panel"><h2>Прибыль по работам</h2>${ranking()}</section></div><section class="panel"><div class="panel-head"><h2>Журнал операций</h2><button id="csv" class="text-btn">Скачать CSV ↓</button></div><div class="tools"><input id="log-search" aria-label="Поиск в журнале" placeholder="Найти операцию…"><select id="log-category" aria-label="Категория"><option value="">Все категории</option>${jobs.map(j=>`<option>${j}</option>`).join('')}</select></div><div id="log-table">${table(filtered())}</div></section><section class="panel" style="margin-top:22px"><h2>Резервная копия</h2><p>Копия включает журнал, автопарк, аренду и таймеры. В локальном режиме данные остаются в браузере; после подключения аккаунта синхронизируются с облаком.</p><div class="row" style="margin-top:16px"><button id="export">Скачать JSON</button><label>Восстановить из JSON<input type="file" id="import" accept=".json,application/json"></label></div></section>`}
function ranking(){let g={};filtered().forEach(e=>g[e.job]=(g[e.job]||0)+net(e));let a=Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,5),max=Math.max(1,...a.map(x=>Math.abs(x[1])));return a.length?a.map(([j,n])=>`<div class="rank"><span>${esc(j)}</span><b class="${n<0?'negative':'positive'}">${money(n)}</b></div><div class="progress"><i style="width:${Math.abs(n)/max*100}%"></i></div>`).join(''):'<div class="empty"><b>Какая работа выгоднее?</b>Добавляй операции, чтобы сравнить свою прибыль.</div>'}
function work(){return `<div class="title"><div><h1>Работы и SHIFT</h1><p>Планируй смену по своим ставкам</p></div><span class="pill">Котировки вводятся вручную</span></div><div class="grid"><section class="panel"><h2>Калькулятор смены</h2><div class="split"><label class="field">Базовый доход в час, $<input id="w-base" type="number" min="0" value="50000"></label><label class="field">Время, часов<input id="w-hours" type="number" min="0.1" step="0.1" value="1"></label><label class="field">SHIFT, %<input id="w-shift" type="number" min="0" max="300" value="100"></label><label class="field">Все расходы, $<input id="w-cost" type="number" min="0" value="0"></label></div><div class="result" id="work-result"></div><p class="caption" style="margin-top:14px">Прогноз при неизменной ставке. 50.000 $ — пример, а не обещанный доход. Для рыбалки считай только добычу, соответствующую наряду.</p></section><section class="panel"><h2>Фактический доход в час</h2><label class="field">Получено за всю сессию, $<input id="actual-income" type="number" min="0" value="0"></label><div class="split"><label class="field">Расходы, $<input id="actual-cost" type="number" min="0" value="0"></label><label class="field">Длительность, минут<input id="actual-min" type="number" min="1" value="60"></label></div><div id="actual-result" class="result"></div></section></div><div class="guide-grid">${guides.slice(0,3).map(guideCard).join('')}<section class="panel"><h2>Выбирай по чистой прибыли</h2><p>Записывай время вместе с дорогой, ожиданием и сдачей добычи. В расходы включай аренду, топливо, расходники и комиссию. Сравни несколько собственных сессий.</p><a class="source" href="#ledger">Открыть журнал →</a></section></div><section class="panel" style="margin-top:24px"><h2>Справочник работ</h2><div class="table-wrap"><table><thead><tr><th>ТИП</th><th>РАБОТЫ</th><th>ПОДРОБНОСТИ</th></tr></thead><tbody><tr><td>Начальные</td><td>Порт, стройка, шахта, ферма</td><td><a class="text-btn" target="_blank" rel="noopener" href="https://wiki.gta5rp.com/">Wiki ↗</a></td></tr><tr><td>С лицензией</td><td>Такси, автобус, механик, дальнобойщик, инкассатор</td><td><a class="text-btn" target="_blank" rel="noopener" href="https://wiki.gta5rp.com/">Wiki ↗</a></td></tr><tr><td>Специальные</td><td>Рыбалка, охота, клады, дайвинг, почта, курьер, пожарный</td><td><a class="text-btn" target="_blank" rel="noopener" href="https://wiki.gta5rp.com/">Wiki ↗</a></td></tr></tbody></table></div></section>`}

function recipePage(){return `<div class="title"><div><h1>Кулинария</h1><p>Ингредиенты, цепочки приготовления и прибыль</p></div><span class="pill">${recipes.length} рецептов в помощнике</span></div><div class="notice">87 рецептов из файла «НА НОЖАХ GTA 5 RP.xlsx», лист «Обновленные». Автор — сообщество Gudes by Q-D. Цены продажи и продуктов вводятся вручную.</div><div class="tools"><input id="recipe-search" placeholder="Название блюда или ингредиент…" aria-label="Поиск рецепта"><select id="recipe-level" aria-label="Уровень навыка"><option value="all">Любой навык</option><option value="unknown">Навык неизвестен</option>${[0,1,2,3,4,5].map(i=>`<option value="${i}">Навык до ${i}</option>`).join('')}</select><select id="recipe-filter" aria-label="Фильтр эффекта"><option value="all">Все эффекты</option><option value="strength">Без потери силы</option><option value="final">Готовые блюда</option><option value="ingredient">Полуфабрикаты</option></select><select id="recipe-display" aria-label="Вид каталога"><option value="cards">Карточки</option><option value="table">Таблица</option></select></div><p id="recipe-count" class="caption" style="margin-bottom:14px"></p><div id="recipe-list" class="recipe-grid"></div><p><a class="source" href="${sources.recipes}" target="_blank" rel="noopener">Автор таблицы: Gudes by Q-D ↗</a></p><section class="panel" style="margin-top:22px"><h2>Примечания из таблицы</h2>${recipeNotes.map(n=>`<p style="margin-top:12px">${esc(n)}</p>`).join('')}</section><section class="panel" style="margin-top:26px"><h2>Прибыль от приготовления</h2><p>Считай цену ингредиентов на одно готовое блюдо, включая полуфабрикаты.</p><div class="split"><label class="field">Себестоимость 1 блюда, $<input id="cook-cost" type="number" min="0" value="0"></label><label class="field">Цена продажи 1 блюда, $<input id="cook-price" type="number" min="0" value="0"></label><label class="field">Количество блюд<input id="cook-count" type="number" min="1" step="1" value="1"></label><label class="field">Бюджет на продукты, $<input id="cook-budget" type="number" min="0" value="0"></label></div><div id="cook-result" class="result"></div></section>`}
function showRecipes(){const q=$('#recipe-search').value.toLowerCase(),level=$('#recipe-level').value,filter=$('#recipe-filter').value;const list=recipes.map((r,i)=>({r,i})).filter(({r,i})=>(r[0]+' '+r[1].join(' ')).toLowerCase().includes(q)&&(level==='all'||(level==='unknown'?r[6]===null:r[6]!==null&&r[6]<=+level))&&(filter==='all'||filter==='strength'&&r[5]===0||filter==='final'&&recipeMeta[i].final||filter==='ingredient'&&!recipeMeta[i].final));$('#recipe-count').textContent=`Показано ${list.length} из ${recipes.length} · 19 рецептов без указанного навыка`;const target=$('#recipe-list');target.className=$('#recipe-display').value==='table'?'panel table-wrap':'recipe-grid';target.innerHTML=!list.length?'<div class="empty">Нет рецептов по выбранным условиям.</div>':$('#recipe-display').value==='table'?`<table><thead><tr><th>Блюдо</th><th>Ингредиенты</th><th>Инструмент</th><th>Сытость</th><th>Настроение</th><th>Сила</th><th>Навык</th></tr></thead><tbody>${list.map(({r,i})=>`<tr><td><button class="text-btn" data-recipe="${i}">${esc(r[0])}</button></td><td>${esc(r[1].join(' + '))}</td><td>${esc(r[2])}</td><td>${r[3]??'—'}</td><td>${r[4]??'—'}</td><td>${r[5]??'Несъедобно'}</td><td>${r[6]??'Нет инф.'}</td></tr>`).join('')}</tbody></table>`:list.map(({r,i})=>`<button class="recipe" data-recipe="${i}"><small>${esc(r[2])} · ${r[6]===null?'Навык: нет информации':'Навык '+r[6]}</small><h3>${esc(r[0])}</h3><span class="caption">${recipeMeta[i].final?'Готовое блюдо':'Полуфабрикат'}</span><p>${esc(r[1].join(' + '))}</p><div class="metrics"><span>Сытость <b>${r[3]??'—'}</b></span><span>Настроение <b>${r[4]??'—'}</b></span><span>Сила <b>${r[5]??'н/с'}</b></span></div></button>`).join('');$$('[data-recipe]').forEach(b=>b.onclick=()=>recipeDetail(+b.dataset.recipe))}
function recipeDetail(i){const r=recipes[i],steps=[],path=new Set();function walk(x){if(path.has(x[0]))throw Error('Циклическая зависимость рецепта');path.add(x[0]);x[1].forEach(n=>{const sub=recipes.find(y=>y[0]===n);if(sub)walk(sub)});path.delete(x[0]);steps.push(`${esc(x[1].join(' + '))} → <b>${esc(x[0])}</b> <span class="pill">${esc(x[2])}</span>`)}walk(r);const event=eventSteps[r[0]];$('#modal').innerHTML=`<button class="close" onclick="this.closest('dialog').close()" aria-label="Закрыть">×</button><small>${r[6]===null?'НАВЫК НЕ УКАЗАН':'НАВЫК '+r[6]}</small><h2>${esc(r[0])}</h2><h3>Порядок приготовления</h3><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="notice">Сытость: ${r[3]??'—'} · Настроение: ${r[4]??'—'} · Сила: ${r[5]??'несъедобно'}</div><p>Цепочка раскрывает полуфабрикаты из листа «Обновленные». Повторяющийся компонент показан для каждого использования; количество порций таблица не задаёт.</p>${r[1].some(n=>n.includes('рыба')||n.includes('*'))?`<details style="margin-top:15px"><summary>Какая рыба подходит?</summary>${recipeNotes.slice(1).map(n=>`<p>${esc(n)}</p>`).join('')}</details>`:''}${event?`<details style="margin-top:15px"><summary>Шаги из листа «Летний ивент»</summary><p>Отдельная инструкция из файла; наличие события в игре не подтверждено.</p><ol>${event.map(t=>`<li>${esc(t.ingredients.join(' + '))} <span class="pill">${esc(t.tool)}</span></li>`).join('')}</ol></details>`:''}<p class="caption" style="margin-top:18px">Источник: «НА НОЖАХ GTA 5 RP.xlsx» · «Обновленные» · строка ${recipeMeta[i].row}</p><a class="source" href="${sources.recipes}" target="_blank" rel="noopener">Автор: Gudes by Q-D ↗</a>`;$('#modal').showModal()}
function timerPage(){return `<div class="title"><div><h1>Таймеры</h1><p>Задай время и занимайся своей игрой</p></div><button id="enable-sound">Проверить звук ♫</button></div><section class="panel"><h2>Новый таймер</h2><form id="timer-form" class="split"><label class="field">Название<input id="timer-name" maxlength="80" value="Поиск сокровищ" required></label><label class="field">Минуты<input id="timer-min" type="number" min="0.1" max="1440" step="0.1" value="4" required></label><button class="primary">＋ Запустить таймер</button></form><p style="margin-top:14px">4 минуты — настраиваемый пример. Укажи свой КД из игры. Для звука оставь вкладку открытой; в фоне телефон может задерживать сигнал.</p></section><div class="recipe-grid" id="timers-list" style="margin-top:24px"></div>`}
function timerCards(){if(!$('#timers-list'))return;$('#timers-list').innerHTML=timers.length?timers.map(t=>`<section class="panel timer-card ${t.done?'finished':''}"><h3>${esc(t.name)}</h3><div class="timer-value" data-clock="${t.id}"></div><div class="row"><button data-restart="${t.id}">Ещё раз</button><button data-remove-timer="${t.id}" aria-label="Удалить таймер ${esc(t.name)}">Удалить</button></div></section>`).join(''):'<div class="empty"><b>Нет активных таймеров</b>Добавь первый таймер выше.</div>';$$('[data-restart]').forEach(b=>b.onclick=()=>{const t=timers.find(t=>t.id===b.dataset.restart);if(!canEdit())return;t.end=Date.now()+t.duration;t.done=false;persist();timerCards()});$$('[data-remove-timer]').forEach(b=>b.onclick=()=>{if(!canEdit())return;timers=timers.filter(t=>t.id!==b.dataset.removeTimer);persist();timerCards()});tick()}
function beep(){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.7);o.start();o.stop(audioCtx.currentTime+.7)}catch{toast('Браузер не поддерживает звуковой сигнал')}}
function tick(){timers.forEach(t=>{let s=Math.max(0,Math.ceil((t.end-Date.now())/1000));const el=document.querySelector(`[data-clock="${t.id}"]`);if(el)el.textContent=s?`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`:'Готово';if(!s&&!t.done&&canEdit(false)){t.done=true;persist();beep();toast('Таймер завершён: '+t.name);if(el)el.closest('.panel').classList.add('finished')}})}setInterval(tick,500);
function guidePage(){return `<div class="title"><div><h1>База знаний</h1><p>Полезные механики без мифов о гарантированном заработке</p></div></div><div class="tools"><input id="guide-search" aria-label="Поиск по базе знаний" placeholder="Найти механику: SHIFT, рыбалка, опыт…"></div><div id="guide-list" class="guide-grid">${guides.map(guideCard).join('')}</div><section class="panel" style="margin-top:24px"><h2>Об информации</h2><p>Проверено 13 сентября 2026 года. Это независимый помощник, не официальный сайт GTA5RP. Справочник — подборка механик, а не полная база всех систем игры. Котировки, цены и изменения после этой даты сверяй в игре и в источниках.</p><a class="source" href="https://wiki.gta5rp.com/" target="_blank" rel="noopener">Официальная GTA5RP Wiki ↗</a> · <a class="source" href="${sources.recipes}" target="_blank" rel="noopener">Рецепты: таблица Gudes by Q-D ↗</a></section>`}

function render(){view=location.hash.slice(1)||'overview';if(!tabs.some(t=>t[0]===view))view='overview';$('#crumb').textContent=tabs.find(t=>t[0]===view)[1];$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===view));$('#app').innerHTML=({overview,ledger,work,recipes:recipePage,timers:timerPage,guide:guidePage,garage:garagePage,account:accountPage})[view]();$$('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});bindEntry();bindRows();refreshAccountBadge();if(view==='garage')bindGarage();if(view==='account')bindAccount();if(view==='ledger'){$('#log-search').oninput=updateLog;$('#log-category').onchange=updateLog;$('#csv').onclick=()=>{let csv='Дата;Описание;Категория;Сумма;Комиссия;Чистый итог\r\n'+filtered().map(e=>[e.date,e.description,e.job,e.amount,e.fee,net(e)].map(v=>'"'+String(v).replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"').join(';')).join('\r\n');download('MAXI-operations.csv','\ufeff'+csv,'text/csv;charset=utf-8')};$('#export').onclick=backup;$('#import').onchange=importBackup}if(view==='work'){calcWork();$$('#app input').forEach(i=>i.oninput=calcWork)}if(view==='recipes'){showRecipes();$('#recipe-search').oninput=showRecipes;$('#recipe-level').onchange=showRecipes;$('#recipe-filter').onchange=showRecipes;$('#recipe-display').onchange=showRecipes;calcCook();$$('[id^=cook-]').filter(i=>i.tagName==='INPUT').forEach(i=>i.oninput=calcCook)}if(view==='timers'){timerCards();$('#enable-sound').onclick=beep;$('#timer-form').onsubmit=e=>{e.preventDefault();if(!canEdit())return;const duration=+$('#timer-min').value*60000,name=$('#timer-name').value.trim();if(!name||duration<6000||duration>86400000)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch{}timers.push({id:crypto.randomUUID(),name,duration,end:Date.now()+duration,done:false});persist();timerCards();toast('Таймер запущен')}}if(view==='guide')$('#guide-search').oninput=()=>{$('#guide-list').innerHTML=guides.filter(g=>(g.title+g.text+g.category).toLowerCase().includes($('#guide-search').value.toLowerCase())).map(guideCard).join('')||'<div class="empty">Ничего не найдено.</div>'}}

async function importBackup(ev){const importScope=activeScope;const file=ev.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const state=validateState(JSON.parse(await file.text()));if(activeScope!==importScope)return toast('Аккаунт изменился. Повтори импорт.');if(!canEdit())return;if(!confirm('Заменить текущие данные резервной копией? Это обновит и облачное сохранение после синхронизации.'))return;applyState(state);persist();render();toast('Резервная копия восстановлена')}catch{toast('Не удалось прочитать файл. Нужна корректная резервная копия MAXI.')}}

function accountPage(){const pending=cloudInfo.conflict;return `<div class="title"><div><h1>Аккаунт и синхронизация</h1><p>Журнал, машины и аренда на твоих устройствах</p></div></div>${!cloudConfigured()?'<div class="notice">Синхронизация пока не подключена владельцем сайта. Автопарк и калькулятор работают локально. Регистрация станет доступна после подключения хранилища.</div>':''}<div class="grid"><section class="panel">${cloudInfo.user?`<h2>${esc(cloudInfo.user.email||'Мой аккаунт')}</h2><p id="cloud-status" role="status">${esc(cloudInfo.error||cloudInfo.status)}</p><button id="sync-now" class="primary full" ${cloudInfo.busy?'disabled':''}>Синхронизировать сейчас</button><button id="guest-import" class="full">Перенести данные локального режима</button><button id="sign-out" class="full">Выйти из аккаунта</button>${pending?'<div class="notice">Сохранение изменилось на другом устройстве или в другой вкладке. Чтобы не затереть данные, автоматическая запись приостановлена.</div><button id="conflict-download" class="full">Скачать мою текущую копию</button><button id="conflict-remote" class="full">Загрузить данные из облака</button><button id="conflict-local" class="danger full">Заменить облако моей копией</button>':''}${cloudInfo.recovery?'<form id="new-password-form"><label class="field">Новый пароль<input id="new-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><button class="primary full">Сохранить новый пароль</button></form>':''}`:`<div class="period"><button data-auth-mode="login" class="${authMode==='login'?'active':''}">Вход</button><button data-auth-mode="signup" class="${authMode==='signup'?'active':''}">Регистрация</button></div><form id="auth-form"><label class="field">Электронная почта<input id="auth-email" type="email" autocomplete="email" maxlength="254" required ${!cloudConfigured()?'disabled':''}></label><label class="field">Пароль<input id="auth-password" type="password" minlength="${authMode==='signup'?10:1}" maxlength="128" autocomplete="${authMode==='signup'?'new-password':'current-password'}" required ${!cloudConfigured()?'disabled':''}></label>${authMode==='signup'?'<p>Минимум 10 символов. После регистрации проверь письмо для подтверждения адреса.</p>':''}<button class="primary full" ${!cloudConfigured()||!cloudInfo.client?'disabled':''}>${authMode==='signup'?'Создать аккаунт':'Войти'}</button><p id="auth-message" role="status">${esc(cloudInfo.error)}</p></form><button class="text-btn" style="margin-top:20px" id="reset-password" ${!cloudInfo.client?'disabled':''}>Забыл пароль</button>`}</section><section class="panel"><h2>Твои данные</h2><ul><li>Автопарк и вся история аренды.</li><li>Доходы, расходы и комиссии.</li><li>Таймеры с сохранённым временем окончания.</li></ul><p>Войди в один аккаунт на телефоне и компьютере. Синхронизация выполняется после изменений, при возвращении во вкладку и каждые 30 секунд, пока сайт открыт.</p><div class="notice">До подключения аккаунта записи сохраняются только в этом браузере. Локальные данные переносятся в аккаунт отдельной кнопкой.</div><button id="account-backup" class="full">Скачать резервную копию</button><p class="caption" style="margin-top:14px">Пароли обрабатывает служба авторизации; они не сохраняются в журнале или резервных копиях.</p></section></div>`}
function authError(err){const s=String(err?.message||'');if(/invalid login/i.test(s))return 'Неверная почта или пароль.';if(/email not confirmed/i.test(s))return 'Сначала подтверди почту по ссылке в письме.';if(/rate.limit|too many|security purposes/i.test(s))return 'Слишком много попыток. Попробуй позже.';if(/password/i.test(s))return 'Пароль не соответствует требованиям сервиса.';return 'Не удалось связаться с сервисом. Проверь интернет и попробуй снова.'}
function bindAccount(){$$('[data-auth-mode]').forEach(b=>b.onclick=()=>{authMode=b.dataset.authMode;render()});$('#account-backup')?.addEventListener('click',backup);const form=$('#auth-form');if(form)form.onsubmit=async e=>{e.preventDefault();if(!cloudInfo.client)return;const email=$('#auth-email').value.trim(),password=$('#auth-password').value,button=form.querySelector('button');button.disabled=true;$('#auth-message').textContent='Подождите…';try{const result=authMode==='signup'?await cloudInfo.client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await cloudInfo.client.auth.signInWithPassword({email,password});if(result.error)throw result.error;if($('#auth-message'))$('#auth-message').textContent=authMode==='signup'?'Проверь почту: если требуется подтверждение, письмо отправлено.':'Загружаем данные…'}catch(err){if($('#auth-message'))$('#auth-message').textContent=authError(err)}finally{button.disabled=false}};$('#reset-password')?.addEventListener('click',async()=>{const email=$('#auth-email').value.trim();if(!email||!$('#auth-email').checkValidity())return toast('Введи свою электронную почту');try{const {error}=await cloudInfo.client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;toast('Если аккаунт существует, письмо для сброса пароля отправлено.')}catch(e){toast(authError(e))}});$('#sync-now')?.addEventListener('click',()=>{if(cloudInfo.conflict)return toast('Сначала выбери способ разрешения конфликта ниже');syncCloud()});$('#sign-out')?.addEventListener('click',async()=>{if(cloudInfo.working||cloudInfo.busy)return toast('Дождись завершения синхронизации');if(cloudInfo.dirty&&!confirm('Есть несинхронизированные изменения. Они останутся в этом браузере для этого аккаунта. Выйти?'))return;const {error}=await cloudInfo.client.auth.signOut({scope:'local'});if(error)toast(authError(error))});$('#guest-import')?.addEventListener('click',importGuest);$('#conflict-download')?.addEventListener('click',backup);$('#conflict-remote')?.addEventListener('click',()=>resolveConflict('remote'));$('#conflict-local')?.addEventListener('click',()=>resolveConflict('local'));$('#new-password-form')?.addEventListener('submit',async e=>{e.preventDefault();const {error}=await cloudInfo.client.auth.updateUser({password:$('#new-password').value});if(error)return toast(authError(error));cloudInfo.recovery=false;render();toast('Пароль изменён')})}
function queueCloudSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncCloud(),700)}
async function fetchCloud(){const {data,error}=await cloudInfo.client.from('maxi_user_data').select('revision,payload').eq('user_id',cloudInfo.user.id).maybeSingle();if(error)throw error;return data?{revision:data.revision,state:validateState(data.payload)}:{revision:0,state:blankState()}}
async function syncCloud(){if(!cloudInfo.client||!cloudInfo.user||cloudInfo.working||cloudInfo.conflict)return;const scope=activeScope;cloudInfo.working=true;cloudInfo.status='Синхронизация…';cloudInfo.error='';refreshAccountBadge();try{const seq=mutationSeq;if(cloudInfo.dirty){const data=stateSnapshot();validateState(data);const {data:result,error}=await cloudInfo.client.rpc('maxi_save_state',{expected_revision:cloudInfo.revision,new_payload:data});if(error)throw error;if(scope!==activeScope)return;cloudInfo.revision=result;cloudInfo.dirty=mutationSeq!==seq;saveLocal(false)}else{const remote=await fetchCloud();if(scope!==activeScope)return;if(mutationSeq!==seq){queueCloudSync();return}if(remote.revision!==cloudInfo.revision){if($('#modal').open){cloudInfo.conflict=true;cloudInfo.status='Облако изменилось во время редактирования';return}applyState(remote.state);cloudInfo.revision=remote.revision;saveLocal(false);render()}}cloudInfo.status=cloudInfo.dirty?'Ожидает синхронизации':'Синхронизировано';if(cloudInfo.dirty)queueCloudSync()}catch(e){if(scope!==activeScope)return;if(/MAXI_CONFLICT/.test(e.message||'')){cloudInfo.conflict=true;cloudInfo.status='Конфликт данных';cloudInfo.error='Данные в облаке изменились. Выбери сохранение в разделе «Аккаунт».';if(view==='account')render();toast('Синхронизация приостановлена: данные изменились на другом устройстве.')}else{cloudInfo.status='Не синхронизировано';cloudInfo.error='Не удалось синхронизировать. Локальная копия сохранена; проверь интернет или подключение базы.'}}finally{if(scope===activeScope){cloudInfo.working=false;refreshAccountBadge()}}}
async function switchSession(session,event){const user=session?.user;if(user?.id===cloudInfo.user?.id){if(event==='PASSWORD_RECOVERY'){cloudInfo.recovery=true;location.hash='account';render()}return}cloudInfo.busy=true;clearTimeout(syncTimer);cloudInfo.user=user||null;activeScope=user?.id||'guest';cloudInfo.working=false;cloudInfo.conflict=false;cloudInfo.error='';cloudInfo.recovery=event==='PASSWORD_RECOVERY';applyState(loadLocalScope());cloudInfo.status=user?'Загружаем облачное сохранение…':'Локальный режим';if($('#modal').open)$('#modal').close();render();if(user)await syncCloud();cloudInfo.busy=false;if(cloudInfo.recovery)location.hash='account';render();refreshAccountBadge()}
async function resolveConflict(choice){if(!cloudInfo.user||cloudInfo.working)return;if(!confirm(choice==='remote'?'Загрузить облачную версию вместо текущей? Текущая копия будет скачана.':'Заменить облачные данные текущей копией? Изменения другого устройства не будут объединены.'))return;backup();const scope=activeScope;cloudInfo.busy=true;try{const remote=await fetchCloud();if(scope!==activeScope)return;if(choice==='remote'){applyState(remote.state);cloudInfo.dirty=false}else cloudInfo.dirty=true;cloudInfo.revision=remote.revision;cloudInfo.conflict=false;saveLocal(false);await syncCloud();render()}catch{toast('Не удалось получить облачное сохранение. Данные не заменены.')}finally{cloudInfo.busy=false;refreshAccountBadge()}}
function importGuest(){if(!canEdit()||!cloudInfo.user)return;let guest;try{const saved=JSON.parse(localStorage.getItem('maxi.v3.guest'));guest=validateState(saved?.state||{version:1,entries:JSON.parse(localStorage.getItem('maxi.entries'))||[],timers:JSON.parse(localStorage.getItem('maxi.timers'))||[]})}catch{return toast('Локальную копию не удалось прочитать')}if(!guest.entries.length&&!guest.cars.length&&!guest.timers.length)return toast('В локальном режиме нет записей');if(!confirm('Заменить данные аккаунта записями локального режима? Текущая копия аккаунта будет скачана.'))return;backup();applyState(guest);persist();render();toast('Локальные данные перенесены, выполняется синхронизация')}
async function startCloud(){if(!cloudConfigured()){render();return}cloudInfo.busy=true;cloudInfo.status='Подключаем аккаунт…';render();try{cloudInfo.client=window.supabase.createClient(window.MAXI_CONFIG.supabaseUrl,window.MAXI_CONFIG.supabaseKey,{auth:{storageKey:'maxi.auth.v3',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});cloudInfo.client.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{authSerial=authSerial.then(()=>switchSession(session,event)).catch(()=>{cloudInfo.busy=false;cloudInfo.error='Не удалось загрузить аккаунт';refreshAccountBadge()})},0)});cloudInfo.ready=true;const {data,error}=await cloudInfo.client.auth.getSession();if(error)throw error;authSerial=authSerial.then(()=>switchSession(data.session,'INITIAL_SESSION'));await authSerial}catch{cloudInfo.error='Сервис аккаунтов недоступен. Локальный режим продолжает работать.'}finally{cloudInfo.busy=false;render();refreshAccountBadge()}}
window.addEventListener('online',()=>syncCloud());window.addEventListener('focus',()=>{if(!$('#modal')?.open)syncCloud()});window.addEventListener('beforeunload',e=>{if(cloudInfo.dirty){e.preventDefault();e.returnValue=''}});setInterval(()=>{if(document.visibilityState==='visible')syncCloud()},30000);

</script><script>
render();
startCloud();

</script></body></html>
